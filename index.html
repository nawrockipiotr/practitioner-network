<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InfraBooster — Countries × Sectors</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --surface: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-muted: #9a9a9a;
    --line-idle: rgba(0, 0, 0, 0.06);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--ink);
    font-family: "Titillium Web", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: 740px;
    height: 430px;
    background: transparent;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .replay {
    position: absolute;
    top: 14px;
    left: 14px;
    height: 32px;
    padding: 0 12px;
    border-radius: 16px;
    border: 1px solid var(--line-idle);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    z-index: 10;
    transition: all 0.2s ease;
    font-family: "Titillium Web", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  .replay:hover { color: var(--ink); }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line-idle);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0,0,0,0.08);
    padding: 10px 12px;
    font-size: 11.5px;
    line-height: 1.45;
    max-width: 310px;
    z-index: 20;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }

  .tooltip.show { opacity: 1; transform: translateY(0); }

  .tooltip .tt-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 12.5px;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-idle);
  }

  .tooltip .tt-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .tooltip .tt-count {
    margin-left: auto;
    font-size: 10.5px;
    color: var(--ink-muted);
    font-weight: 500;
  }

  .tooltip ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .tooltip li {
    color: var(--ink-soft);
  }

  .tooltip .tt-name {
    color: var(--ink);
  }

  .tooltip .tt-pill {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    color: #fff;
    font-weight: 600;
    margin-left: 4px;
    vertical-align: 1px;
  }

  @media (max-width: 760px) {
    body { padding: 12px; }
    .stage {
      width: 100%;
      max-width: 740px;
      aspect-ratio: 740 / 430;
      height: auto;
    }
  }
</style>
</head>

<body>
<div class="stage">
  <button class="replay" id="replay" title="Replay">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10"></polyline>
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
    </svg>
    Replay
  </button>
  <canvas id="net"></canvas>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
</div>

<script>
(() => {
  const STAGE_W = 740;
  const STAGE_H = 430;

  const countries = [
    { code: "AL", flag: "🇦🇱", name: "Albania" },
    { code: "BA", flag: "🇧🇦", name: "Bosnia & Herzegovina" },
    { code: "BG", flag: "🇧🇬", name: "Bulgaria" },
    { code: "HU", flag: "🇭🇺", name: "Hungary" },
    { code: "LV", flag: "🇱🇻", name: "Latvia" },
    { code: "MK", flag: "🇲🇰", name: "N. Macedonia" },
    { code: "RO", flag: "🇷🇴", name: "Romania" },
    { code: "RS", flag: "🇷🇸", name: "Serbia" },
    { code: "ES", flag: "🇪🇸", name: "Spain" },
    { code: "TR", flag: "🇹🇷", name: "Türkiye" },
    { code: "UA", flag: "🇺🇦", name: "Ukraine" }
  ];

  const categories = [
    { id: "agri", label: "Agriculture & Food", full: "Agriculture, Food Systems & Circular Bioeconomy", services: 16, color: "#1a3795" },
    { id: "health", label: "Healthcare & Biotech", full: "Healthcare, Biotechnology & Pharmaceuticals", services: 7, color: "#fdcd15" },
    { id: "digital", label: "Digital & Policy", full: "Digital, Urban Innovation & Policy Intelligence", services: 7, color: "#00A7B5" },
    { id: "sustainability", label: "Sustainability & Advanced Tech", full: "Sustainability, Advanced Materials & Industrial Technologies", services: 7, color: "#8A5CF6" }
  ];

  const serviceRows = [
    ["AL","agri","Seed testing services"],
    ["AL","digital","ECO-VR — VR platform for green transition in education"],

    ["BA","agri","TrueWineID"],
    ["BA","agri","R&D services in boosting production with gene-assisted selection"],
    ["BA","health","Permeatest: Permeation testing services"],
    ["BA","digital","AgriSkill Tracker"],

    ["BG","agri","Microbiological control of food products based on MALDI-TOF MS"],
    ["BG","digital","GATE AVS: Advanced visualization solutions for cities"],

    ["HU","sustainability","AI Training Data Generation for AgriRobotic"],

    ["LV","health","Development of novel bio-based ingredients for pharmaceutical produce"],

    ["MK","agri","Science-driven consumer insights"],
    ["MK","agri","Seed quality control and plant health analysis"],
    ["MK","digital","Complete solution for digital transformation in manufacturing"],

    ["RO","agri","Development of innovative fish feed"],
    ["RO","agri","AgriSmart solutions by BioBIT"],
    ["RO","agri","AG NutriField by bioBIT"],
    ["RO","agri","Development of healthy bakery and pastry products"],
    ["RO","health","PharmaPhytoLab"],

    ["RS","agri","Development of innovative pesticide products"],
    ["RS","agri","CharmsLab"],
    ["RS","agri","Valorzyme"],
    ["RS","agri","Development of New Fruit & Vegetable-Based Products"],
    ["RS","health","Pharma quality control"],
    ["RS","health","Prenatal GeneCheck"],
    ["RS","digital","Blockchain testbed"],
    ["RS","sustainability","NanoSense"],
    ["RS","sustainability","Microplastics extraction and analysis"],

    ["ES","agri","Development of healthier foods through extrusion"],

    ["TR","agri","Alternative proteins using ultrasound-assisted protein extraction"],
    ["TR","health","GMP-Compliant Production of Cell Therapies"],
    ["TR","health","PhytoLab"],
    ["TR","digital","MuseXR"],
    ["TR","sustainability","Smart Textile Knitting Services"],

    ["UA","digital","Digital maturity consulting for business"],
    ["UA","sustainability","Mobile power quality diagnostics service"],
    ["UA","sustainability","Pilot line for hydrogel materials"],
    ["UA","sustainability","Precision soil diagnostics and fertilization plan"]
  ];

  const countryByCode = Object.fromEntries(countries.map(c => [c.code, c]));
  const catById = Object.fromEntries(categories.map(c => [c.id, c]));

  countries.forEach(c => {
    c.cats = [];
    c.services = [];
  });

  serviceRows.forEach(([code, catId, service]) => {
    const c = countryByCode[code];
    if (!c.cats.includes(catId)) c.cats.push(catId);
    c.services.push({ catId, service });
  });

  const servicesByCategory = {};
  categories.forEach(cat => servicesByCategory[cat.id] = []);
  serviceRows.forEach(([code, catId, service]) => {
    servicesByCategory[catId].push({
      flag: countryByCode[code].flag,
      country: countryByCode[code].name,
      service
    });
  });

  const canvas = document.getElementById("net");
  const ctx = canvas.getContext("2d");
  const tooltip = document.getElementById("tooltip");
  const stageEl = document.querySelector(".stage");

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(canvas.width / STAGE_W, 0, 0, canvas.height / STAGE_H, 0, 0);
  }

  const PADDING_TOP = 50;
  const PADDING_BOTTOM = 24;

  const COUNTRY_LABEL_LEFT = 28;
  const COUNTRY_X = 210;

  const CATEGORY_X = STAGE_W - 210;
  const CATEGORY_LABEL_RIGHT = STAGE_W - 28;

  const NODE_R_COUNTRY = 5;
  const NODE_R_CATEGORY = 6;

  const countryNodes = [];
  {
    const n = countries.length;
    const top = PADDING_TOP + 8;
    const bot = STAGE_H - PADDING_BOTTOM - 8;
    const step = (bot - top) / (n - 1);
    countries.forEach((c, i) => {
      countryNodes.push({
        ...c,
        x: COUNTRY_X,
        y: top + i * step,
        empty: c.cats.length === 0
      });
    });
  }

  const categoryNodes = [];
  {
    const n = categories.length;
    const top = PADDING_TOP + 42;
    const bot = STAGE_H - PADDING_BOTTOM - 42;
    const step = (bot - top) / (n - 1);
    categories.forEach((c, i) => {
      categoryNodes.push({
        ...c,
        x: CATEGORY_X,
        y: top + i * step,
        revealAt: i * 1200
      });
    });
  }

  const nodeCatById = Object.fromEntries(categoryNodes.map(c => [c.id, c]));

  const links = [];
  countryNodes.forEach(cn => {
    cn.cats.forEach(catId => {
      const cat = nodeCatById[catId];
      const count = cn.services.filter(s => s.catId === catId).length;
      links.push({
        country: cn,
        cat,
        count,
        lightAt: cat.revealAt + 100 + Math.random() * 450
      });
    });
  });

  const pulses = [];
  const TOTAL_REVEAL_MS = (categoryNodes.length - 1) * 1200 + 1000;

  function bezier(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return {
      x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
      y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
    };
  }

  function linkPoints(link) {
    const a = link.country;
    const b = link.cat;
    const ax = a.x + 7;
    const bx = b.x - 7;
    const dx = bx - ax;
    return {
      p0: { x: ax, y: a.y },
      p1: { x: ax + dx * 0.55, y: a.y },
      p2: { x: ax + dx * 0.45, y: b.y },
      p3: { x: bx, y: b.y }
    };
  }

  function withAlpha(hex, a) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return "rgba(" + r + ", " + g + ", " + b + ", " + a + ")";
  }

  function drawLink(link, lit, intensity, dim) {
    const { p0, p1, p2, p3 } = linkPoints(link);
    const dimMul = dim ? 0.12 : 1;
    const focusMul = (hoverState.kind && !dim) ? 1.3 : 1;

    const widthBase = 0.75 + Math.min(link.count, 4) * 0.22;

    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);

    if (lit) {
      ctx.strokeStyle = withAlpha(link.cat.color, 0.55 * intensity * dimMul * focusMul);
      ctx.lineWidth = widthBase * (focusMul > 1 ? 1.4 : 1);
      ctx.shadowColor = withAlpha(link.cat.color, 0.6 * intensity * dimMul);
      ctx.shadowBlur = dim ? 0 : 6;
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
      ctx.strokeStyle = withAlpha(link.cat.color, 0.95 * intensity * dimMul * focusMul);
      ctx.lineWidth = 0.45 * (focusMul > 1 ? 1.5 : 1);
      ctx.stroke();
    } else {
      ctx.strokeStyle = "rgba(0,0,0,0.05)";
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }

  function drawCountryNode(cn, dim) {
    const alpha = dim ? 0.35 : 1;
    ctx.globalAlpha = alpha;

    ctx.beginPath();
    ctx.arc(cn.x, cn.y, NODE_R_COUNTRY - 0.5, 0, Math.PI * 2);
    ctx.fillStyle = "#1a1a1a";
    ctx.fill();

    ctx.fillStyle = "#1a1a1a";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = "13px 'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
    ctx.fillText(cn.flag, COUNTRY_LABEL_LEFT, cn.y);

    ctx.font = "500 12px 'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
    ctx.fillText(cn.name, COUNTRY_LABEL_LEFT + 24, cn.y);

    ctx.globalAlpha = 1;
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function drawCategoryNode(cat, revealProgress, dim, focused) {
    if (revealProgress <= 0) return;

    const ease = easeOutCubic(Math.min(1, revealProgress));
    const baseAlpha = dim ? 0.3 : 1;

    if (revealProgress < 1.6) {
      ctx.globalAlpha = baseAlpha;
      ctx.beginPath();
      ctx.arc(cat.x, cat.y, 7 + (1 - Math.min(1, revealProgress)) * 14, 0, Math.PI * 2);
      ctx.strokeStyle = withAlpha(cat.color, 0.4 * (1 - Math.min(1, revealProgress)));
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if (focused) {
      ctx.globalAlpha = 1;
      const r = NODE_R_CATEGORY + 4 + Math.sin(performance.now() * 0.006) * 1.5;
      ctx.beginPath();
      ctx.arc(cat.x, cat.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = withAlpha(cat.color, 0.5);
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.globalAlpha = baseAlpha;
    const nr = (focused ? NODE_R_CATEGORY + 1 : NODE_R_CATEGORY) * ease;
    ctx.beginPath();
    ctx.arc(cat.x, cat.y, nr, 0, Math.PI * 2);
    ctx.fillStyle = cat.color;
    ctx.shadowColor = withAlpha(cat.color, 0.6);
    ctx.shadowBlur = dim ? 0 : 8;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.globalAlpha = ease * baseAlpha;
    ctx.fillStyle = "#1a1a1a";
    ctx.textBaseline = "middle";
    ctx.textAlign = "right";
    ctx.font = "700 13px 'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
    ctx.fillText(cat.label, CATEGORY_LABEL_RIGHT, cat.y - 7);

    ctx.fillStyle = "#7a7a7a";
    ctx.font = "11px 'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
    ctx.fillText(cat.services + " services", CATEGORY_LABEL_RIGHT, cat.y + 7);
    ctx.globalAlpha = 1;
  }

  function drawPulse(p) {
    const pts = linkPoints(p.link);
    const pos = bezier(pts.p0, pts.p1, pts.p2, pts.p3, p.t);
    const color = p.link.cat.color;

    for (let i = 6; i >= 1; i--) {
      const tt = Math.max(0, p.t - i * 0.028);
      const tp = bezier(pts.p0, pts.p1, pts.p2, pts.p3, tt);
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, 2.2 - i * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = withAlpha(color, 0.08 * (7 - i));
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = withAlpha(color, 0.2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
    ctx.shadowColor = color;
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawHeaders() {
    const y = 30;
    ctx.fillStyle = "#7a7a7a";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = "600 10px 'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
    const countriesX = COUNTRY_LABEL_LEFT + 92;
    ctx.fillText("COUNTRIES", countriesX, y);

    ctx.beginPath();
    ctx.moveTo(countriesX, y + 10);
    ctx.lineTo(countriesX + 28, y + 10);
    ctx.strokeStyle = "#1a1a1a";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const categoriesX = CATEGORY_LABEL_RIGHT - 56;
    ctx.textAlign = "right";
    ctx.fillStyle = "#7a7a7a";
    ctx.fillText("SECTORS", categoriesX, y);

    ctx.beginPath();
    ctx.moveTo(categoriesX - 28, y + 10);
    ctx.lineTo(categoriesX, y + 10);
    ctx.stroke();
  }

  let startTime = null;
  let lastPulseSpawn = 0;

  function spawnPulse() {
    if (!links.length) return;
    const link = links[Math.floor(Math.random() * links.length)];
    pulses.push({ link, t: 0, speed: 0.4 + Math.random() * 0.5 });
  }

  function frame(now) {
    if (!startTime) startTime = now;
    const elapsed = now - startTime;
    const dt = Math.min(50, now - (frame._last || now)) / 1000;
    frame._last = now;

    ctx.clearRect(0, 0, STAGE_W, STAGE_H);

    const focusedLinks = new Set();
    const focusedCountries = new Set();
    const focusedCategories = new Set();

    if (hoverState.kind === "country") {
      const cn = hoverState.target;
      focusedCountries.add(cn);
      links.forEach(l => {
        if (l.country === cn) {
          focusedLinks.add(l);
          focusedCategories.add(l.cat);
        }
      });
    } else if (hoverState.kind === "category") {
      const cat = hoverState.target;
      focusedCategories.add(cat);
      links.forEach(l => {
        if (l.cat === cat) {
          focusedLinks.add(l);
          focusedCountries.add(l.country);
        }
      });
    }

    const hasHover = hoverState.kind != null;

    const drawOrder = links.slice().sort((a, b) => {
      const af = focusedLinks.has(a) ? 1 : 0;
      const bf = focusedLinks.has(b) ? 1 : 0;
      return af - bf;
    });

    drawOrder.forEach(l => {
      const since = elapsed - l.lightAt;
      const dim = hasHover && !focusedLinks.has(l);
      if (since < 0) {
        drawLink(l, false, 0, dim);
      } else {
        drawLink(l, true, Math.min(1, since / 600), dim);
      }
    });

    countryNodes.forEach(cn => {
      drawCountryNode(cn, hasHover && !focusedCountries.has(cn));
    });

    categoryNodes.forEach(cat => {
      const since = elapsed - cat.revealAt;
      const progress = since / 400;
      drawCategoryNode(
        cat,
        progress,
        hasHover && !focusedCategories.has(cat),
        focusedCategories.has(cat) && hasHover
      );
    });

    if (elapsed > TOTAL_REVEAL_MS) {
      if (now - lastPulseSpawn > 180) {
        if (Math.random() < 0.7) spawnPulse();
        lastPulseSpawn = now;
      }
      if (Math.random() < 0.005) spawnPulse();
    } else {
      categoryNodes.forEach(cat => {
        if (elapsed > cat.revealAt + 300 && Math.random() < 0.04) {
          const linkSet = links.filter(l => l.cat === cat);
          if (linkSet.length) {
            pulses.push({
              link: linkSet[Math.floor(Math.random() * linkSet.length)],
              t: 0,
              speed: 0.5 + Math.random() * 0.4
            });
          }
        }
      });
    }

    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      p.t += p.speed * dt;
      if (p.t >= 1) {
        pulses.splice(i, 1);
        continue;
      }
      drawPulse(p);
    }

    drawHeaders();
    requestAnimationFrame(frame);
  }

  document.getElementById("replay").addEventListener("click", () => {
    startTime = null;
    pulses.length = 0;
    links.forEach(l => {
      l.lightAt = l.cat.revealAt + 100 + Math.random() * 450;
    });
  });

  const hoverState = { kind: null, target: null };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function getCanvasScale() {
    const rect = canvas.getBoundingClientRect();
    return { sx: rect.width / STAGE_W, sy: rect.height / STAGE_H, rect };
  }

  function pickNode(mouseX, mouseY) {
    const countryHitRight = COUNTRY_X + 10;
    const countryHitLeft = COUNTRY_LABEL_LEFT - 4;

    if (mouseX >= countryHitLeft && mouseX <= countryHitRight) {
      let best = null, bestD = Infinity;
      countryNodes.forEach(cn => {
        const d = Math.abs(cn.y - mouseY);
        if (d < bestD) { bestD = d; best = cn; }
      });
      if (best && bestD < 13) return { kind: "country", target: best };
    }

    const categoryHitLeft = CATEGORY_X - 10;
    const categoryHitRight = CATEGORY_LABEL_RIGHT + 4;

    if (mouseX >= categoryHitLeft && mouseX <= categoryHitRight) {
      let best = null, bestD = Infinity;
      categoryNodes.forEach(cat => {
        const d = Math.abs(cat.y - mouseY);
        if (d < bestD) { bestD = d; best = cat; }
      });
      if (best && bestD < 18) return { kind: "category", target: best };
    }

    return null;
  }

  function buildCountryTooltip(cn) {
    const items = cn.services.map(p => {
      const cat = catById[p.catId];
      return '<li><span class="tt-name">' + escapeHtml(p.service) + '</span>' +
             '<span class="tt-pill" style="background:' + cat.color + '">' + escapeHtml(cat.label) + '</span></li>';
    }).join("");

    return '<div class="tt-head"><span style="font-size:14px">' + cn.flag + '</span>' +
           '<span>' + escapeHtml(cn.name) + '</span>' +
           '<span class="tt-count">' + cn.services.length + ' services</span></div>' +
           '<ul>' + items + '</ul>';
  }

  function buildCategoryTooltip(cat) {
    const list = servicesByCategory[cat.id] || [];
    const items = list.map(p => '<li><span style="font-size:13px">' + p.flag + '</span> ' +
      '<span class="tt-name">' + escapeHtml(p.service) + '</span></li>').join("");

    return '<div class="tt-head"><span class="tt-dot" style="background:' + cat.color + '"></span>' +
           '<span>' + escapeHtml(cat.full) + '</span>' +
           '<span class="tt-count">' + list.length + ' services</span></div>' +
           '<ul>' + items + '</ul>';
  }

  function showTooltip(html, anchorX, anchorY, scale) {
    tooltip.innerHTML = html;
    tooltip.classList.add("show");

    const ttW = tooltip.offsetWidth;
    const ttH = tooltip.offsetHeight;
    const stageRect = stageEl.getBoundingClientRect();

    let px = anchorX * scale.sx;
    let py = anchorY * scale.sy;

    let left = px + 14;
    let top = py - ttH - 12;

    if (left + ttW > stageRect.width - 8) left = px - ttW - 14;
    if (left < 8) left = 8;
    if (top < 8) top = py + 14;
    if (top + ttH > stageRect.height - 8) top = stageRect.height - ttH - 8;

    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
  }

  function hideTooltip() {
    tooltip.classList.remove("show");
  }

  function updateHover(clientX, clientY) {
    const scale = getCanvasScale();
    const mx = (clientX - scale.rect.left) / scale.sx;
    const my = (clientY - scale.rect.top) / scale.sy;
    const hit = pickNode(mx, my);

    if (!hit) {
      hoverState.kind = null;
      hoverState.target = null;
      hideTooltip();
      stageEl.style.cursor = "default";
      return;
    }

    hoverState.kind = hit.kind;
    hoverState.target = hit.target;
    stageEl.style.cursor = "pointer";

    if (hit.kind === "country") {
      showTooltip(buildCountryTooltip(hit.target), hit.target.x, hit.target.y, scale);
    } else {
      showTooltip(buildCategoryTooltip(hit.target), hit.target.x, hit.target.y, scale);
    }
  }

  stageEl.addEventListener("mousemove", e => updateHover(e.clientX, e.clientY));
  stageEl.addEventListener("mouseleave", () => {
    hoverState.kind = null;
    hoverState.target = null;
    hideTooltip();
    stageEl.style.cursor = "default";
  });

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
})();
</script>
